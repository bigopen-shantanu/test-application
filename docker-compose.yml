services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
      POSTGRES_DB: chatapp
    ports:
      - "5433:5432"
    volumes:
      - chat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_OWNER:-your-github-username}/chat-app-backend:latest
    build:
      context: ./backend
    container_name: chat-app-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://chatuser:chatpassword@postgres:5432/chatapp?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"

  frontend:
    image: ghcr.io/${GITHUB_OWNER:-your-github-username}/chat-app-frontend:latest
    build:
      context: ./frontend
    container_name: chat-app-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  chat_pg_data:
